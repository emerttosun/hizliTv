name: Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check distributable sources
        run: |
          python3 scripts/check_public.py
          python3 scripts/check_translations.py
          python3 -m unittest discover -s airplay/tests
      - name: Test, lint and assemble
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :media-core:test :player:testDebugUnitTest :launcher:lintDebug :player:lintDebug :tv-ui:lintDebug :launcher:assembleDebug
      - name: Check optional legacy migration tool
        run: ./gradlew --no-daemon -PincludeLegacyBridge=true :legacy-bridge:lintDebug :legacy-bridge:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hizlitv-debug-apk
          path: launcher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            media-core/build/reports/tests/
            player/build/reports/tests/
            launcher/build/reports/lint-results-debug.html
            player/build/reports/lint-results-debug.html
            tv-ui/build/reports/lint-results-debug.html
            legacy-bridge/build/reports/lint-results-debug.html
