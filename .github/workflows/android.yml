name: Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check distributable sources
        run: |
          python3 scripts/check_public.py
          python3 scripts/check_translations.py
          python3 -m unittest discover -s airplay/tests
      - name: Test, lint and assemble
        shell: bash
        run: |
          chmod +x gradlew
          mkdir -p build/ci
          # Keep a copy of the console so a failure can be reported as annotations below.
          ./gradlew --no-daemon :media-core:test :player:testDebugUnitTest :tv-ui:testDebugUnitTest :launcher:lintDebug :player:lintDebug :tv-ui:lintDebug :launcher:assembleDebug 2>&1 | tee build/ci/gradle.txt
          exit "${PIPESTATUS[0]}"
      - name: Report failures as annotations
        if: failure()
        run: python3 scripts/ci_failures.py
      - name: Check optional legacy migration tool
        run: ./gradlew --no-daemon -PincludeLegacyBridge=true :legacy-bridge:lintDebug :legacy-bridge:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: hizlitv-debug-apk
          path: launcher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-reports
          path: |
            media-core/build/reports/tests/
            player/build/reports/tests/
            tv-ui/build/reports/tests/
            launcher/build/reports/lint-results-debug.html
            player/build/reports/lint-results-debug.html
            tv-ui/build/reports/lint-results-debug.html
            legacy-bridge/build/reports/lint-results-debug.html
